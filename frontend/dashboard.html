<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="nav-brand">
                <span>🎓</span> Smart Attendance
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="registration.html">Registration</a>
                <a href="attendance.html">Attendance</a>
                <a href="dashboard.html" style="color: var(--primary);">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Stats Row -->
        <div class="grid grid-4" style="margin-bottom: 1.5rem;">
            <div class="card stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotalStudents">0</div>
                    <div class="stat-label">Total Students</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-value" id="statPresent" style="color: var(--success);">0</div>
                    <div class="stat-label">Present Today</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon">❌</div>
                <div class="stat-info">
                    <div class="stat-value" id="statAbsent" style="color: var(--error);">0</div>
                    <div class="stat-label">Absent</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-value" id="statPercentage" style="color: var(--warning);">0%</div>
                    <div class="stat-label">Attendance %</div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard Area -->
        <div class="grid" style="grid-template-columns: 3fr 1fr;">
            <!-- Left: Table and Filters -->
            <div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                        <h3>Attendance Records</h3>
                        <div style="display: flex; gap: 0.5rem;">
                            <select id="sessionFilter" class="form-select" style="width: auto;">
                                <option value="">Select Session...</option>
                            </select>
                            <input type="date" id="dateFilter" class="form-input" style="width: auto;">
                            <button id="btnExport" class="btn btn-secondary">Export CSV</button>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table class="table" id="dashboardTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                    <th>Confidence</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right: Recent Activity -->
            <div>
                <div class="card">
                    <h3>Recent Activity</h3>
                    <div id="activityFeed" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Activity items populated by JS -->
                        <p style="color: var(--text-muted); font-size: 0.875rem;">No recent activity.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=10"></script>
    <script src="js/dashboard.js?v=10"></script>
</body>
</html>
